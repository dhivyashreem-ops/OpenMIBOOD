dataset:
  name: midog
  num_classes: 3
  pre_size: 50
  image_size: 50

  interpolation: bilinear
  normalization_type: midog

  num_workers: 0
  num_gpus: 1
  num_machines: 1

  split_names: [train, val, test]

  train:
    dataset_class: ImglistDataset
    data_dir: ./data/midog/
    imglist_pth: ./data/benchmark_imglist/midog/train_midog_expA.txt
    batch_size: 16
    shuffle: True

  val:
    dataset_class: ImglistDataset
    data_dir: ./data/midog/
    imglist_pth: ./data/benchmark_imglist/midog/valid_midog.txt
    batch_size: 32
    shuffle: False

  test:
    dataset_class: ImglistDataset
    data_dir: ./data/midog/
    imglist_pth: ./data/benchmark_imglist/midog/test_midog.txt
    batch_size: 32
    shuffle: False
